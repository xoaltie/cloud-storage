databaseChangeLog:
  - changeSet:
      id: create-resources-table
      author: xoaltie
      changes:
        - createTable:
            tableName: resources
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: size
                  type: bigint
                  constraints:
                    nullable: true
              - column:
                  name: parent_id
                  type: bigint
                  constraints:
                    nullable: true
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseColumnNames: parent_id
            baseTableName: resources
            constraintName: fk_resources_parent_id
            referencedColumnNames: id
            referencedTableName: resources
            validate: true
        - addForeignKeyConstraint:
            baseColumnNames: user_id
            baseTableName: resources
            constraintName: fk_resources_user_id
            referencedColumnNames: id
            referencedTableName: users
            validate: true
        - addUniqueConstraint:
            columnNames: parent_id, name
            constraintName: uk_resources_parent_id_name
            tableName: resources
            validate: true